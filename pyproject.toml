[project]
name = "vikram"
version = "0.1.0"
description = "A single local assistant powered by Pydantic AI and Ollama."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai]==2.54.0",
    "pydantic-evals==2.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vikram = "vikram.cli:main"
vikram-eval = "vikram.evals.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/vikram",
    "/.pre-commit-config.yaml",
    "/AGENTS.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
]
