[project]
name = "vikram"
version = "0.1.0"
description = "A single local assistant powered by Pydantic AI and Ollama."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<0.29",
    "mcp>=1.26,<2",
    "openpyxl>=3.1.5,<4",
    "pillow>=12.0,<13",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic-ai-harness==0.54.0",
    "pydantic-ai-slim[openai]==2.54.0",
    "pydantic-evals==2.54.0",
    "pydantic-monty==1.1.0",
    "pypdf>=6.20.1,<7",
    "python-docx>=1.2,<2",
    "rich>=15,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vikram = "vikram.cli:main"
vikram-eval = "vikram.evals.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/vikram",
    "/.pre-commit-config.yaml",
    "/AGENTS.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "pyinstaller>=6.16,<7",
]
