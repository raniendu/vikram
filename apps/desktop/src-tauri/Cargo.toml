[package]
name = "vikram-desktop"
version = "0.1.0"
description = "Private local conversations with Ollama"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
rfd = "0.17"
base64 = "0.22"
arboard = { version = "3", default-features = false }
open = "5"
url = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
