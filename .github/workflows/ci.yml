name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Check CLI startup
        run: uv run vikram --help
      - name: Check evaluation CLI startup
        run: uv run vikram-eval --help
      - name: Check formatting
        run: uv run black --check vikram
      - name: Check import ordering
        run: uv run isort --check-only vikram
