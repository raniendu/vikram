[package]
name = "vikram-studio"
version = "0.1.0"
description = "Vikram Studio — build, run and compare agents"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
rand = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
